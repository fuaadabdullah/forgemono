<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Assistant - Chat Frontend Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }
        
        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .status {
            display: flex;
            gap: 15px;
            font-size: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }
        
        .status-indicator.loading {
            background: #fbbf24;
            animation: pulse 1s infinite;
        }
        
        .status-indicator.error {
            background: #f87171;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            display: flex;
            margin-bottom: 12px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.assistant {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 4px;
        }
        
        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
            padding: 0 4px;
        }
        
        .message.user .message-meta {
            text-align: right;
        }
        
        .thinking {
            padding: 12px 16px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 14px;
            color: #856404;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            border-radius: 0 0 12px 12px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
        }
        
        #messageInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }
        
        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        
        .error-message {
            padding: 12px 16px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 6px;
            color: #c33;
            margin-bottom: 10px;
        }
        
        .info-panel {
            padding: 15px;
            background: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            color: #1565c0;
            margin-bottom: 15px;
        }
        
        .info-panel strong {
            color: #0d47a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧙 Goblin Assistant Chat</h1>
            <div class="status">
                <div class="status-item">
                    <div class="status-indicator" id="frontendStatus"></div>
                    <span>Frontend: <strong id="frontendStatusText">checking...</strong></span>
                </div>
                <div class="status-item">
                    <div class="status-indicator" id="backendStatus"></div>
                    <span>Backend: <strong id="backendStatusText">checking...</strong></span>
                </div>
                <div class="status-item">
                    <div class="status-indicator" id="providerStatus"></div>
                    <span>Kamatera LLM: <strong id="providerStatusText">checking...</strong></span>
                </div>
            </div>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="info-panel">
                <strong>ℹ️ System Status Check</strong><br>
                Verifying frontend, backend, and LLM provider connectivity...
            </div>
        </div>
        
        <div class="input-area">
            <div style="width: 100%;">
                <textarea
                    id="messageInput"
                    placeholder="Type your message here... (Shift+Enter for new line, Enter to send)"
                    rows="2"
                ></textarea>
                <div class="controls" style="margin-top: 10px;">
                    <button id="clearBtn">Clear Chat</button>
                    <button id="sendBtn">Send Message</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        const frontendStatus = document.getElementById('frontendStatus');
        const backendStatus = document.getElementById('backendStatus');
        const providerStatus = document.getElementById('providerStatus');
        
        const frontendStatusText = document.getElementById('frontendStatusText');
        const backendStatusText = document.getElementById('backendStatusText');
        const providerStatusText = document.getElementById('providerStatusText');
        
        let isWaiting = false;
        
        // Scroll to bottom
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // Add message to chat
        function addMessage(content, role, meta = '') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            
            if (meta) {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'message-meta';
                metaDiv.textContent = meta;
                messageDiv.appendChild(metaDiv);
            }
            
            chatBox.appendChild(messageDiv);
            scrollToBottom();
        }
        
        // Set status indicator
        function setStatus(element, statusText, status) {
            element.className = 'status-indicator';
            if (status === 'loading') {
                element.classList.add('loading');
                statusText.textContent = 'Loading...';
            } else if (status === 'ok') {
                element.classList.add('ok');
                statusText.textContent = 'OK';
            } else if (status === 'error') {
                element.classList.add('error');
                statusText.textContent = 'Error';
            }
        }
        
        // Initialize - check system status
        async function initializeSystem() {
            chatBox.innerHTML = '';
            
            // Check frontend
            setStatus(frontendStatus, frontendStatusText, 'loading');
            try {
                const response = await fetch(window.location.origin);
                if (response.ok) {
                    setStatus(frontendStatus, frontendStatusText, 'ok');
                }
            } catch (e) {
                setStatus(frontendStatus, frontendStatusText, 'error');
                addMessage(`Frontend error: ${e.message}`, 'assistant');
            }
            
            // Check backend
            setStatus(backendStatus, backendStatusText, 'loading');
            try {
                const response = await fetch('http://localhost:8004/health');
                if (response.ok) {
                    setStatus(backendStatus, backendStatusText, 'ok');
                } else {
                    setStatus(backendStatus, backendStatusText, 'error');
                    addMessage('Backend returned unexpected status', 'assistant');
                }
            } catch (e) {
                setStatus(backendStatus, backendStatusText, 'error');
                addMessage(`Backend error: ${e.message}`, 'assistant');
            }
            
            // Check provider via backend health
            setStatus(providerStatus, providerStatusText, 'loading');
            try {
                const response = await fetch('http://localhost:8004/health');
                const data = await response.json();
                if (data.providers && data.providers.llamacpp_kamatera) {
                    const provider = data.providers.llamacpp_kamatera;
                    if (provider.status === 'healthy') {
                        setStatus(providerStatus, providerStatusText, 'ok');
                        addMessage(`✅ All systems operational! Kamatera Router: ${provider.endpoint}`, 'assistant');
                    } else {
                        setStatus(providerStatus, providerStatusText, 'error');
                        addMessage(`Provider status: ${provider.status}`, 'assistant');
                    }
                }
            } catch (e) {
                setStatus(providerStatus, providerStatusText, 'error');
            }
            
            addMessage('Chat is ready! Send a message to test the Kamatera LLM provider.', 'assistant');
        }
        
        // Send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isWaiting) return;
            
            messageInput.value = '';
            sendBtn.disabled = true;
            isWaiting = true;
            
            // Add user message
            addMessage(message, 'user', new Date().toLocaleTimeString());
            
            // Add thinking indicator
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking';
            thinkingDiv.textContent = '🤔 Kamatera LLM is thinking...';
            chatBox.appendChild(thinkingDiv);
            scrollToBottom();
            
            try {
                const response = await fetch('http://localhost:8004/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: message }],
                        model: 'qwen2.5:latest'
                    })
                });
                
                thinkingDiv.remove();
                
                if (response.status === 401) {
                    addMessage('Authentication required. Please provide API key in headers.', 'assistant');
                } else if (response.ok) {
                    const data = await response.json();
                    const responseText = data.result?.text || 'No response';
                    const latency = data.latency_ms || 0;
                    addMessage(responseText, 'assistant', `Latency: ${latency.toFixed(0)}ms`);
                } else {
                    const error = await response.text();
                    addMessage(`Error (${response.status}): ${error}`, 'assistant');
                }
            } catch (e) {
                thinkingDiv.remove();
                addMessage(`Error: ${e.message}`, 'assistant');
            }
            
            sendBtn.disabled = false;
            isWaiting = false;
            messageInput.focus();
        }
        
        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', () => {
            chatBox.innerHTML = '';
            messageInput.value = '';
        });
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Initialize on load
        window.addEventListener('load', initializeSystem);
        
        // Auto-focus input
        messageInput.focus();
    </script>
</body>
</html>
