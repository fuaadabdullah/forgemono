version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: goblin-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: goblin-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: goblin_data
      POSTGRES_USER: goblin_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goblin_user -d goblin_data']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  goblin-router:
    build:
      context: ./goblin-router
      dockerfile: Dockerfile
    container_name: goblin-router
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - LLM_SERVER_1=http://192.175.23.150:8002
      - LLM_SERVER_2=http://192.175.23.150:8003
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://goblin_user:${POSTGRES_PASSWORD}@postgres:5432/goblin_data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery-worker-high:
    build:
      context: ./celery
      dockerfile: Dockerfile
    container_name: celery-worker-high
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://goblin_user:${POSTGRES_PASSWORD}@postgres:5432/goblin_data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=2 --pool=prefork -Q high_priority

  celery-worker-default:
    build:
      context: ./celery
      dockerfile: Dockerfile
    container_name: celery-worker-default
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://goblin_user:${POSTGRES_PASSWORD}@postgres:5432/goblin_data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=4 --pool=prefork -Q default

  celery-worker-low:
    build:
      context: ./celery
      dockerfile: Dockerfile
    container_name: celery-worker-low
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://goblin_user:${POSTGRES_PASSWORD}@postgres:5432/goblin_data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A celery_app worker --loglevel=info --concurrency=2 --pool=prefork -Q low_priority

  celery-beat:
    build:
      context: ./celery
      dockerfile: Dockerfile
    container_name: celery-beat
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://goblin_user:${POSTGRES_PASSWORD}@postgres:5432/goblin_data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  flower:
    build:
      context: ./celery
      dockerfile: Dockerfile
    container_name: goblin-flower
    restart: unless-stopped
    ports:
      - '5555:5555'
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app flower --address=0.0.0.0 --port=5555 --basic_auth=${FLOWER_BASIC_AUTH}

  nginx:
    image: nginx:alpine
    container_name: goblin-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      goblin-router:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  backup_data:
    driver: local

networks:
  default:
    name: goblin-network
    driver: bridge
